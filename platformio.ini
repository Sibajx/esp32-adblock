; ESP32 clásico (WROOM-32 / DevKit V1, 4 MB flash, sin PSRAM)
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -Wall
  -DCORE_DEBUG_LEVEL=1
