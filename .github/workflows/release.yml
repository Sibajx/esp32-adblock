# SiBlock: publicación de cada versión (tag vX.Y.Z).
#
# 1. Compila el firmware sin secrets.h, con la versión del tag.
# 2. Arma public/ (página de site/ + firmware/ con manifest.json de ESP Web Tools), con
#    version.json y js/config.js reescritos para esta versión (make_site_files.py).
# 3. Crea la Release de GitHub con el .bin unido desde 0x0 y las tres partes.
# 4. Despliega public/ a Cloudflare Pages (proyecto "siblock"), solo si existe el secreto
#    CLOUDFLARE_API_TOKEN. Si no está, se salta y lo dice.
#
# Secretos del repo:
#   CLOUDFLARE_API_TOKEN  : token con un único permiso, "Cloudflare Pages: Edit", y solo en la
#                           cuenta de SiBlock (nada de DNS, Workers ni otras cuentas).
#   CLOUDFLARE_ACCOUNT_ID : id de esa cuenta.
#
# Variables del repo (no son secretos: terminan en la página pública; pueden faltar):
#   CF_WA_TOKEN        : token de Cloudflare Web Analytics. Vacío = la página no carga analítica.
#   TURNSTILE_SITEKEY  : clave pública de Turnstile. Vacío = los formularios no la cargan.
#   Solo se aceptan letras, números, '_' y '-'; otra cosa detiene la publicación.
#   SIBLOCK_APOYO_URL  : enlace de apoyo (https://<sitio>[/<ruta>], sin '?' ni '#').
#                        Vacío = la página no muestra el botón de apoyo. Si no cumple, se detiene.
#
# El Worker de cloud/ no se despliega aquí (lo hace el autor a mano, ver cloud/DEPLOY.md).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Compilar y publicar la versión
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # solo para crear la Release
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Revisar el nombre de la versión
        # El tag entra en flags del compilador y en nombres de archivo: solo vX.Y.Z.
        run: |
          # Misma regla que la placa al comparar versiones: cada parte 0..9999, sin ceros a la izquierda.
          if ! printf '%s' "$VERSION" | grep -qxE 'v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})'; then
            echo "tag no válido: se espera vX.Y.Z (cada parte 0..9999, sin ceros a la izquierda)"; exit 1
          fi

      - name: Sin secrets.h (el firmware publicado no lleva datos del autor)
        run: |
          if test -f src/secrets.h; then echo "src/secrets.h no debe estar en el repo"; exit 1; fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Sin actions/cache: la herramienta del firmware publicado se baja limpia cada vez.

      - name: Instalar PlatformIO y esptool
        run: pip install platformio==6.1.19 esptool==4.8.1

      - name: Probar make_manifest.py y make_site_files.py
        run: |
          python3 .github/scripts/test_make_manifest.py
          python3 .github/scripts/test_make_site_files.py

      - name: Revisar las variables de la página (antes de crear la Release)
        # Las variables entran por env, nunca pegadas en el script del paso.
        env:
          CF_WA_TOKEN: ${{ vars.CF_WA_TOKEN }}
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          SIBLOCK_APOYO_URL: ${{ vars.SIBLOCK_APOYO_URL }}
        run: |
          python3 .github/scripts/make_site_files.py --version "$VERSION" --out "$RUNNER_TEMP/revisar-site" \
            --wa-token "$CF_WA_TOKEN" --turnstile-sitekey "$TURNSTILE_SITEKEY" \
            --apoyo-url "$SIBLOCK_APOYO_URL"

      - name: pio run (con la versión del tag)
        run: |
          set -o pipefail
          PLATFORMIO_BUILD_FLAGS="-DSIBLOCK_VERSION=\\\"${VERSION}\\\"" pio run 2>&1 | tee pio.log

      - name: Flash por debajo de 92 %
        run: |
          pct=$(grep -oP 'Flash:.*?\K[0-9]+(\.[0-9]+)?(?=%)' pio.log | tail -n1)
          test -n "$pct" || { echo "no encontré la línea Flash: en la salida de pio"; exit 1; }
          echo "Flash: ${pct} %"
          awk -v p="$pct" 'BEGIN { exit !(p < 92.0) }' || { echo "Flash ${pct} % no queda por debajo de 92,0 %"; exit 1; }

      - name: Armar public/firmware y manifest.json
        run: |
          mkdir -p public/firmware
          cp .pio/build/esp32dev/bootloader.bin .pio/build/esp32dev/partitions.bin \
             .pio/build/esp32dev/firmware.bin public/firmware/
          python3 .github/scripts/make_manifest.py --version "$VERSION" --out public/firmware

      - name: Unir en un solo .bin desde 0x0 (sin LittleFS)
        run: |
          python -m esptool --chip esp32 merge_bin -o "siblock-${VERSION}.bin" \
            0x1000 public/firmware/bootloader.bin \
            0x8000 public/firmware/partitions.bin \
            0x10000 public/firmware/firmware.bin
          sha256sum "siblock-${VERSION}.bin" public/firmware/*.bin | tee SHA256SUMS.txt

      - name: Crear la Release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<EOF
          SiBlock ${VERSION}.

          La forma fácil de instalarlo es desde la página: https://siblock.s-dev.win

          Para instalar de cero con esptool (borra el WiFi y la contraseña guardados; la lista se queda):
          \`esptool.py --chip esp32 write_flash 0x0 siblock-${VERSION}.bin\`

          Los archivos bootloader.bin, partitions.bin, firmware.bin y manifest.json son los que
          usa la página para actualizar sin borrar tu WiFi ni tu contraseña.
          EOF
          gh release create "$VERSION" "siblock-${VERSION}.bin" public/firmware/* SHA256SUMS.txt \
            --verify-tag --title "SiBlock ${VERSION}" --notes-file notas.md

      - name: Copiar la página (site/) a public/ sin pisar public/firmware
        run: |
          rsync -a --exclude '/firmware/' --exclude '/tests/' --exclude '/node_modules/' \
            --exclude '/package.json' --exclude '/package-lock.json' site/ public/
          test -f public/index.html
          test -d public/en
          test -f public/firmware/manifest.json

      - name: version.json y js/config.js de esta versión
        env:
          CF_WA_TOKEN: ${{ vars.CF_WA_TOKEN }}
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          SIBLOCK_APOYO_URL: ${{ vars.SIBLOCK_APOYO_URL }}
        run: |
          python3 .github/scripts/make_site_files.py --version "$VERSION" --out public \
            --wa-token "$CF_WA_TOKEN" --turnstile-sitekey "$TURNSTILE_SITEKEY" \
            --apoyo-url "$SIBLOCK_APOYO_URL"
          test -d public/en
          test -f public/version.json
          test -f public/js/config.js
          grep -qF "\"version\":\"${VERSION}\"" public/version.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public
          path: public/
          if-no-files-found: error
          retention-days: 7

  pages:
    name: Publicar la página en Cloudflare Pages
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # El token solo se le da al paso de wrangler: las acciones de terceros no lo ven.
    steps:
      - name: ¿Hay token?
        id: token
        env:
          HAY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "hay=$HAY" >> "$GITHUB_OUTPUT"
          if [ "$HAY" != "true" ]; then echo 'Sin CLOUDFLARE_API_TOKEN: no se publica la página'; fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ steps.token.outputs.hay == 'true' }}
        with:
          name: public
          path: public

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.token.outputs.hay == 'true' }}
        with:
          node-version: '22'

      - name: wrangler pages deploy
        if: ${{ steps.token.outputs.hay == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 pages deploy public --project-name siblock --branch main
